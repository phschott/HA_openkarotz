  - type: sections
    max_columns: 4
    title: Sounds
    path: sounds
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Sounds
            heading_style: title
          - type: entities
            entities:
              - entity: select.openkarotz_sound
          - show_name: true
            show_icon: true
            type: button
            entity: select.openkarotz_sound
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_sound_jouer_un_son
              perform_action: button.press
              data: {}
      - type: grid
        cards:
          - type: heading
            heading: Radios
            heading_style: title
          - type: entities
            entities:
              - entity: select.openkarotz_radios
          - show_name: true
            show_icon: true
            type: button
            entity: button.openkarotz_sound_jouer_la_radio
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_sound_jouer_la_radio
              perform_action: button.press
              data: {}
          - type: tile
            entity: button.openkarotz_sound_pause_reprendre
            vertical: false
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.salon_openkarotz_sound_pause
            features_position: bottom
          - type: tile
            entity: button.openkarotz_sound_arreter
            vertical: false
            tap_action:
              action: call-service
              service: button.press
              target:
                entity_id: button.salon_openkarotz_sound_stop_2
            features_position: bottom
