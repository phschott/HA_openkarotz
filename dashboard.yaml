title: Karotz Dashboard
views:
  - title: Apparence
    path: karotz
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Color
            heading_style: title
          - type: entities
            entities:
              - entity: switch.openkarotz_led_pulse
              - entity: number.openkarotz_pulse_speed
              - entity: light.openkarotz_color_1
              - entity: light.openkarotz_color_2
      - type: grid
        cards:
          - type: heading
            heading: Voice
            heading_style: title
          - type: entities
            entities:
              - entity: select.openkarotz_voice
              - entity: text.openkarotz_tts
              - entity: button.openkarotz_sound_parler
          - type: entities
            entities:
              - entity: select.openkarotz_mood
              - entity: button.openkarotz_sound_appliquer_une_humeur
          - show_name: true
            show_icon: true
            type: button
            entity: button.openkarotz_sound_horloge
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_sound_horloge
              perform_action: button.press
              data: {}
          - show_name: true
            show_icon: true
            type: button
            entity: button.openkarotz_sound_humeur_aleatoire
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_sound_humeur_aleatoire
              perform_action: button.press
              data: {}
      - type: grid
        cards:
          - type: heading
            heading: Ears
            heading_style: title
          - type: entities
            entities:
              - entity: number.openkarotz_ear_left
              - entity: number.openkarotz_ear_right
          - show_name: true
            show_icon: true
            type: button
            entity: button.openkarotz_ears_oreilles_aleatoires
            icon: mdi:rabbit-variant-outline
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_ears_oreilles_aleatoires
              perform_action: button.press
              data: {}
          - show_name: true
            show_icon: true
            type: button
            entity: button.openkarotz_ears_reinitialiser_les_oreilles
            icon: mdi:restore
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_ears_reinitialiser_les_oreilles
              perform_action: button.press
              data: {}
  - type: sections
    max_columns: 4
    title: Photos
    path: photo
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Picture
            heading_style: title
          - show_name: true
            show_icon: true
            type: button
            entity: button.openkarotz_picture_prendre_une_photo
            icon: mdi:camera
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_picture_prendre_une_photo
              perform_action: button.press
              data: {}
          - show_name: true
            show_icon: true
            type: button
            entity: button.openkarotz_picture_supprimer_les_photos
            icon: mdi:trash-can
            tap_action:
              action: perform-action
              target:
                entity_id: button.openkarotz_picture_supprimer_les_photos
              perform_action: button.press
              data: {}
          - type: tile
            grid_options:
              columns: 6
              rows: 2
            entity: sensor.openkarotz_picture_photos
            vertical: false
            tap_action:
              action: none
            features_position: bottom
      - type: grid
        cards:
          - type: heading
            heading: Photos
            heading_style: title
          - type: grid
            columns: 3
            square: true
            cards:
